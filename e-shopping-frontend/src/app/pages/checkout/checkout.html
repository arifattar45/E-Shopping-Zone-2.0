<app-navbar></app-navbar>

<div class="checkout-container">

  <!-- LEFT -->
  <div class="checkout-left">

    <div class="section-card">

      <h2>📍 Delivery Address</h2>

      <div class="form-grid">

        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            [(ngModel)]="fullName"
            placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input
            type="text"
            maxlength="10"
            [(ngModel)]="phone"
            placeholder="9876543210">
        </div>

        <div class="form-group full-width">
          <label>House / Flat No.</label>
          <input
            type="text"
            [(ngModel)]="house"
            placeholder="House No., Apartment">
        </div>

        <div class="form-group full-width">
          <label>Street / Area</label>
          <input
            type="text"
            [(ngModel)]="street"
            placeholder="Street, Area">
        </div>

        <div class="form-group">
          <label>City</label>
          <input
            type="text"
            [(ngModel)]="city"
            placeholder="City">
        </div>

        <div class="form-group">
          <label>State</label>
          <input
            type="text"
            [(ngModel)]="state"
            placeholder="State">
        </div>

        <div class="form-group">
          <label>Pincode</label>
          <input
            type="text"
            maxlength="6"
            [(ngModel)]="pincode"
            placeholder="560064">
        </div>

      </div>

    </div>

    <!-- Payment -->

    <div class="section-card">

      <h2>💳 Payment Method</h2>

      <div
        class="payment-card"
        [class.selected]="paymentMethod=='COD'"
        (click)="paymentMethod='COD'">

        <div>

          <h3>Cash on Delivery</h3>

          <p>Pay when your order arrives.</p>

        </div>

        <input
          type="radio"
          [checked]="paymentMethod=='COD'">

      </div>

      <div
        class="payment-card"
        [class.selected]="paymentMethod=='WALLET'"
        (click)="paymentMethod='WALLET'">

        <div>

          <h3>Wallet</h3>

          <p>Available Balance:
            ₹{{walletBalance}}
          </p>

        </div>

        <input
          type="radio"
          [checked]="paymentMethod=='WALLET'">

      </div>

      <div
        class="payment-card"
        [class.selected]="paymentMethod=='UPI'"
        (click)="paymentMethod='UPI'">

        <div>

          <h3>UPI (Razorpay)</h3>

          <p>Secure online payment</p>

        </div>

        <input
          type="radio"
          [checked]="paymentMethod=='UPI'">

      </div>

    </div>

  </div>

  <!-- RIGHT -->

  <div class="checkout-right">

    <div class="summary-card">

      <h2>📦 Order Summary</h2>

      <div class="summary-row">
        <span>Items</span>
        <span>{{cartItems}}</span>
      </div>

      <div class="summary-row">
        <span>Delivery</span>
        <span class="free">FREE</span>
      </div>

      <hr>

      <div class="summary-row total">
        <span>Total</span>
        <span>₹{{orderTotal}}</span>
      </div>

      <button
        class="place-order-btn"
        (click)="placeOrder()"
        [disabled]="isLoading">

        {{ isLoading ? 'Placing Order...' : 'Place Order' }}

      </button>

      <div
        *ngIf="successMsg"
        class="success-box">

        {{successMsg}}

      </div>

      <div
        *ngIf="errorMsg"
        class="error-box">

        {{errorMsg}}

      </div>

    </div>

  </div>

</div>
