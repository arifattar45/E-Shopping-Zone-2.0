<div class="admin-layout">

  <app-admin-sidebar></app-admin-sidebar>

  <div class="main-content">

    <div class="top-bar">

      <h1>Manage Users</h1>

      <input
        type="text"
        placeholder="Search users..."
        [(ngModel)]="searchText"
        (input)="searchUsers()"
        class="search-box"
      >

    </div>

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let user of filteredUsers">

          <td>#{{user.id}}</td>

          <td>{{user.name}}</td>

          <td>{{user.email}}</td>

          <td>
            <span
              class="role-badge"
              [ngClass]="{
                'admin-role': user.role === 'ROLE_ADMIN',
                'user-role': user.role === 'ROLE_USER'
              }"
            >
              {{user.role}}
            </span>
          </td>

          <td>

            <button
              class="delete-btn"
              (click)="deleteUser(user.id)"
            >
              Delete
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
